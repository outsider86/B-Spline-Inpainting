data:
  dataset_path: /scratch/wangpc/B-Spline-Inpainting/Data/stacking_cups_action_30hz
  observation_source: features
  vision_cache_path: /scratch/wangpc/B-Spline-Inpainting/robot_policy/outputs/DINO_DD_JOINT_H12/cache/dinov2_patch16
  parent_prediction_cache_path: /scratch/wangpc/B-Spline-Inpainting/robot_policy/outputs/DINO_DD_JOINT_H12/cache/parent_predictions
  camera_keys: [observation.images.global, observation.images.hand]
  state_key: observation.state
  action_key: action
  action_horizon: 30
  frequency_hz: 30.0
  split_seed: 20260915
  train_episodes: 42
  val_episodes: 5
  test_episodes: 5
spline:
  degree: 3
  span_length_steps: 2
  num_basis: 18
  vocab_size: 256
  regularization: 0.0001
  implementation_version: uniform_left_direct_fit_v1
vision:
  image_size: 224
  pooled_grid: 16
  tokenizer: dinov2
  feature_dim: 1024
  resampler_tokens_per_camera: 32
  dino_model: vit_large_patch14_reg4_dinov2.lvd142m
  extraction_layer_offset: -2
  pretrained: true
  cache_dtype: float16
policy:
  architecture: discrete_joint
  model_size: DiT-S
  hidden_dim: 384
  depth: 6
  heads: 4
  mlp_ratio: 4.0
  dropout: 0.0
  discrete_rounds: 8
  block_size: 21
  discrete_full_mask_probability: 0.5
train:
  seed: 42
  updates: 50000
  rtc_updates: 5000
  # A single DiT-S batch of 64 fits comfortably on the 96 GiB devices. This
  # is mathematically the same effective batch as 16 x 4 accumulation (no
  # BatchNorm, dropout=0) and also accelerates full-split validation 4x.
  batch_size: 64
  effective_batch_size: 64
  learning_rate: 0.0003
  rtc_learning_rate: 0.00003
  optimizer_beta1: 0.9
  optimizer_beta2: 0.95
  optimizer_epsilon: 0.00000001
  weight_decay: 0.0001
  warmup_updates: 500
  min_lr_ratio: 0.1
  grad_clip: 1.0
  eval_every: 500
  # Use every validation example for unbiased generation-from-scratch model
  # selection. The earlier 64-batch subset is insufficient evidence of
  # convergence for the final checkpoint comparison.
  validation_max_batches: 1000000
  save_every: 2500
  num_workers: 8
  precision: bf16
  lambda_l1: 1.0
  deterministic: true
  use_ema: false
rtc:
  spline_delay_min: 1
  spline_delay_max: 5
  raw_delay_min: 1
  raw_delay_max: 10
  delay_distribution: truncated_decreasing_exponential_reference
  zero_delay_eval: true
wandb:
  enabled: true
  mode: online
  entity: 401910710-university-of-california-berkeley
  base_project: robot-policy-dino-dd-joint-h12-basic
  rtc_project: robot-policy-dino-dd-joint-h12-ttRTC
  output_dir: /scratch/wangpc/B-Spline-Inpainting/robot_policy/outputs/DINO_DD_JOINT_H12/wandb
