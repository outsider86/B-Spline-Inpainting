[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bspline-robot-policy"
version = "0.1.0"
description = "Compact modular B-spline robot policies with RTC"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.15",
  "torch>=2.4",
  "torchvision>=0.19",
  "timm>=1.0",
  "pandas>=2.0",
  "pyarrow>=14",
  "av>=12",
  "matplotlib>=3.8",
  "PyYAML>=6",
  "wandb>=0.18",
  "msgpack>=1.0",
  "websockets>=14",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
audit_data = "robot_policy.cli:audit_data"
prepare_observations = "robot_policy.cli:prepare_observations"
prepare_rgb_cache = "robot_policy.cli:prepare_rgb_cache"
prepare_actions = "robot_policy.cli:prepare_actions"
smoke_test = "robot_policy.cli:smoke_test"
train_base = "robot_policy.cli:train_base"
finetune_rtc = "robot_policy.cli:finetune_rtc"
evaluate_open_loop = "robot_policy.cli:evaluate_open_loop"
evaluate_rtc = "robot_policy.cli:evaluate_rtc"
evaluate_inference_rtc = "robot_policy.cli:evaluate_inference_rtc"
benchmark_inference = "robot_policy.cli:benchmark_inference"
visualize_trajectories = "robot_policy.cli:visualize_trajectories"
replay_rtc = "robot_policy.cli:replay_rtc"
build_report = "robot_policy.cli:build_report"
finalize_checkpoints = "robot_policy.cli:finalize_checkpoints"
verify_reproducibility = "robot_policy.cli:verify_reproducibility"
cache_parent_predictions = "robot_policy.cli:cache_parent_predictions"
compare_representations = "robot_policy.cli:compare_representations"
serve_robot_policy = "robot_policy.deployment.server:main"
export_piper_policy_stats = "robot_policy.deployment.export_stats:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
